<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <title>CRM - Grupo Azul</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta content="CRM Corporativo Grupo Azul" name="description" />
    
    <!-- Librería oficial de Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- Bootstrap y Estilos Oficiales de tu plantilla -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/css/bootstrap.min.css" rel="stylesheet" type="text/css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet" type="text/css">
    
    <style>
        :root {
            --azul-grupo-azul: #0b132b;
            --azul-secundario: #1c2541;
            --azul-acento: #0077b6;
            --cian-brillante: #48cae4;
        }

        /* Pantalla de Login con Supabase integrada con los colores corporativos */
        #login-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: linear-gradient(135deg, var(--azul-grupo-azul) 0%, var(--azul-secundario) 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 99999;
        }

        .login-card {
            background: var(--azul-secundario);
            padding: 40px;
            border-radius: 12px;
            width: 90%;
            max-width: 420px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            text-align: center;
            color: white;
            border: 1px solid #2b3a67;
        }

        .login-logo {
            font-size: 28px;
            font-weight: 800;
            color: var(--cian-brillante);
            margin-bottom: 8px;
            letter-spacing: 1px;
        }

        .login-input {
            width: 100%;
            padding: 12px 16px;
            border-radius: 8px;
            border: 1px solid #2b3a67;
            background: var(--azul-grupo-azul);
            color: white;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        .login-input:focus {
            border-color: var(--cian-brillante);
        }

        .login-submit-btn {
            width: 100%;
            padding: 12px;
            background: var(--azul-acento);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .login-submit-btn:hover {
            background: #005f92;
        }
    </style>
</head>

<body data-sidebar="light">

    <!-- ================================================================== -->
    <!-- PANTALLA DE INICIO DE SESIÓN OBLIGATORIA (SUPABASE) -->
    <!-- ================================================================== -->
    <div id="login-overlay">
        <div class="login-card">
            <div class="login-logo">GRUPO AZUL</div>
            <p style="color: #8d99ae; font-size: 14px; margin-bottom: 28px;">Sistema CRM • Acceso Autorizado</p>
            
            <form id="login-form" onsubmit="handleLogin(event)">
                <div class="mb-3 text-start">
                    <label class="form-label" style="font-size: 12px; color: #8d99ae;">Correo electrónico</label>
                    <input type="email" id="email" class="login-input" placeholder="usuario@grupoazul.com" required>
                </div>
                
                <div class="mb-4 text-start">
                    <label class="form-label" style="font-size: 12px; color: #8d99ae;">Contraseña</label>
                    <input type="password" id="password" class="login-input" placeholder="••••••••" required>
                </div>
                
                <button type="submit" id="btn-submit" class="login-submit-btn">Entrar al CRM</button>
            </form>
            
            <p id="login-error" style="color: #ff6b6b; font-size: 13px; margin-top: 16px; display: none;"></p>
        </div>
    </div>


    <!-- ================================================================== -->
    <!-- ESTRUCTURA PRINCIPAL DEL CRM (TU DISEÑO ORIGINAL) -->
    <!-- ================================================================== -->
    <div id="layout-wrapper">

        <!-- HEADER -->
        <header id="page-topbar">
            <div class="navbar-header">
                <div class="d-flex">
                    <button type="button" class="btn btn-sm px-3 font-size-16 header-item waves-effect vertical-menu-btn">
                        <i class="fa fa-fw fa-bars"></i>
                    </button>
                </div>

                <div class="d-flex">
                    <div class="dropdown d-inline-block">
                        <button type="button" class="btn header-item waves-effect" id="page-header-user-dropdown" data-bs-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
                            <div class="avatar-xs d-inline-block me-2">
                                <span class="avatar-title rounded-circle bg-light text-body">G</span>
                            </div>
                            <span class="d-none d-xl-inline-block ms-1 fw-medium font-size-15" id="user-email-display">grupoazulcol@gmail.com</span>
                            <i class="uil-angle-down d-none d-xl-inline-block font-size-15"></i>
                        </button>
                        <div class="dropdown-menu dropdown-menu-end">
                            <a class="dropdown-item" href="#" onclick="handleLogout()"><i class="uil uil-sign-out-alt font-size-18 align-middle me-1 text-muted" style="color:red"></i><span class="align-middle" style="color:red">Cerrar Sesión</span></a>
                        </div>
                    </div>
                </div>
            </div>
        </header>

        <!-- SIDEBAR -->
        <div class="vertical-menu">
            <div class="navbar-brand-box">
                <a href="#" class="logo logo-dark">
                    <span class="logo-lg">
                        <span style="font-weight: 800; font-size: 18px; color: #0b132b;">GRUPO AZUL</span>
                    </span>
                </a>
            </div>

            <div data-simplebar class="sidebar-menu-scroll">
                <div id="sidebar-menu">
                    <ul class="metismenu list-unstyled" id="side-menu">
                        <li class="menu-title">Menú</li>
                        <li>
                            <a href="#">
                                <i class="fas fa-chart-area"></i>
                                <span>Tablero</span>
                            </a>
                        </li>
                        <li>
                            <a href="javascript: void(0);" class="has-arrow waves-effect">
                                <i class="fas fa-file-contract"></i>
                                <span>Producción</span>
                            </a>
                        </li>
                        <li>
                            <a href="#">
                                <i class="fas fa-calendar"></i>
                                <span>Agenda</span>
                            </a>
                        </li>
                    </ul>
                </div>
            </div>
        </div>

        <!-- CONTENIDO PRINCIPAL -->
        <div class="main-content dashboard-page">
            <div class="page-content">
                <div class="container-fluid">
                    <div class="row dashboard-native-title">
                        <div class="col-12">
                            <div class="page-title-box d-flex align-items-center justify-content-between">
                                <h4 class="mb-0">Dashboard - Grupo Azul</h4>
                                <div class="page-title-right">
                                    <ol class="breadcrumb m-0">
                                        <li class="breadcrumb-item active">Dashboard</li>
                                    </ol>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Tarjetas de Ejemplo / Estados -->
                    <div class="row dashboard-states g-2 g-lg-3">
                        <div class="col-6 col-sm-4 col-xl-3">
                            <div class="card p-3 shadow-sm">
                                <div class="d-flex align-items-center">
                                    <div class="flex-grow-1">
                                        <p class="text-muted mb-1">Contratos Tramitados</p>
                                        <h4 class="mb-0">2</h4>
                                    </div>
                                    <div class="flex-shrink-0 text-primary">
                                        <i class="fas fa-check-double fa-2x"></i>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="col-6 col-sm-4 col-xl-3">
                            <div class="card p-3 shadow-sm">
                                <div class="d-flex align-items-center">
                                    <div class="flex-grow-1">
                                        <p class="text-muted mb-1">KO Valor Crediticio</p>
                                        <h4 class="mb-0">10</h4>
                                    </div>
                                    <div class="flex-shrink-0 text-danger">
                                        <i class="fab fa-korvue fa-2x"></i>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </div>

    <!-- ================================================================== -->
    <!-- SCRIPT DE CONEXIÓN Y LÓGICA DE SUPABASE -->
    <!-- ================================================================== -->
    <script>
        // Tus credenciales configuradas de Supabase
        const SUPABASE_URL = 'https://ughatbtpnkrrgcfalahz.supabase.co';
        // REEMPLAZA ESTO por tu llave pública "anon" / "public" real (la que empieza por eyJ...)
        const SUPABASE_ANON_KEY = 'sb_publishable_DXgx_6-neFL-BpTQLBdFew_XIAizYsQ';

        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // 1. Verificar si ya hay una sesión activa al cargar la página
        window.addEventListener('DOMContentLoaded', async () => {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (session) {
                ocultarLogin(session.user.email);
            }
        });

        // 2. Manejar el inicio de sesión
        async function handleLogin(event) {
            event.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorElement = document.getElementById('login-error');
            const btn = document.getElementById('btn-submit');

            errorElement.style.display = 'none';
            btn.textContent = 'Verificando...';

            const { data, error } = await supabaseClient.auth.signInWithPassword({
                email: email,
                password: password,
            });

            btn.textContent = 'Entrar al CRM';

            if (error) {
                errorElement.textContent = 'Correo o contraseña incorrectos.';
                errorElement.style.display = 'block';
            } else {
                ocultarLogin(data.user.email);
            }
        }

        // 3. Función para ocultar el login y mostrar el CRM
        function ocultarLogin(email) {
            document.getElementById('login-overlay').style.display = 'none';
            const emailDisplay = document.getElementById('user-email-display');
            if (emailDisplay) emailDisplay.textContent = email;
        }

        // 4. Cerrar sesión
        async function handleLogout() {
            await supabaseClient.auth.signOut();
            window.location.reload();
        }
    </script>
</body>
</html>
