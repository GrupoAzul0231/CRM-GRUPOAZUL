<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>CRM - Grupo Azul</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" rel="stylesheet">
<style>
:root{--dark:#0b132b;--navy:#1c2541;--cyan:#48cae4;--bs-primary:#0077b6}
body{background:#f8f9fa;font-family:'Segoe UI',Tahoma,sans-serif}
#login{position:fixed;inset:0;background:linear-gradient(135deg,var(--dark),var(--navy));display:flex;align-items:center;justify-content:center;z-index:9999}
.lcard{background:var(--navy);padding:36px;border-radius:12px;width:90%;max-width:400px;color:#fff;border:1px solid #2b3a67}
.lcard input{background:var(--dark);border:1px solid #2b3a67;color:#fff}
.lcard input:focus{background:var(--dark);color:#fff;border-color:var(--cyan);box-shadow:none}
#app{display:flex;min-height:100vh}
.side{width:240px;background:#fff;border-right:1px solid #e2e8f0;flex-shrink:0}
.brand{background:var(--dark);color:var(--cyan);font-weight:800;height:64px;display:flex;align-items:center;justify-content:center}
.side a.nav-l{display:flex;gap:10px;align-items:center;padding:10px 14px;margin:4px 10px;border-radius:6px;color:#475569;text-decoration:none;font-weight:500}
.side a.nav-l.on{background:#e0f2fe;color:var(--bs-primary);font-weight:700}
.main{flex:1;min-width:0}
.top{background:#fff;border-bottom:1px solid #e2e8f0;height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 24px}
.view{display:none;padding:24px}.view.on{display:block}
.sc{background:#fff;border:1px solid #e2e8f0;border-radius:8px;padding:14px;cursor:pointer;display:flex;gap:12px;align-items:center;height:100%}
.sc:hover{box-shadow:0 4px 10px rgba(0,0,0,.08)}.sc.sel{border-color:var(--bs-primary);background:#f0f9ff}
.sc .n{font-size:22px;font-weight:700;line-height:1}.sc .l{font-size:12px;color:#64748b}
.sc i{width:40px;height:40px;border-radius:8px;display:flex;align-items:center;justify-content:center}
.det{background:#fff;border-left:4px solid var(--bs-primary);padding:14px 18px;border-radius:6px}
.lb{font-size:11px;text-transform:uppercase;color:#64748b;font-weight:700;display:block}
.xb{width:26px;height:26px;border-radius:50%;border:0;background:var(--bs-primary);color:#fff;font-size:11px}
@media(max-width:768px){.side{display:none}}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login">
  <div class="lcard text-center">
    <div class="fs-3 fw-bold" style="color:var(--cyan)">GRUPO AZUL</div>
    <p class="text-secondary small mb-4">Acceso seguro al CRM</p>
    <form onsubmit="login(event)" class="text-start">
      <input id="email" type="email" class="form-control mb-3" placeholder="Correo" required>
      <input id="pass" type="password" class="form-control mb-3" placeholder="Contraseña" required>
      <button id="btn-login" class="btn btn-primary w-100 fw-bold">Entrar</button>
    </form>
    <p id="login-err" class="text-danger small mt-3 mb-0" style="display:none"></p>
  </div>
</div>

<!-- APP -->
<div id="app">
  <aside class="side">
    <div class="brand">GRUPO AZUL</div>
    <div class="p-3 border-bottom bg-light"><small class="text-muted d-block">Conectado como</small>
      <strong id="who" class="small" style="word-break:break-all">...</strong></div>
    <nav class="pt-2">
      <a href="#" class="nav-l on" onclick="vista('v-dash',this)"><i class="fas fa-chart-area"></i>Tablero</a>
      <a href="#" class="nav-l" onclick="vista('v-contratos',this)"><i class="fas fa-file-contract"></i>Contratos</a>
      <a href="#" id="nav-equipo" class="nav-l d-none" onclick="vista('v-equipo',this);cargarEquipo()"><i class="fas fa-user-friends"></i>Equipo</a>
    </nav>
  </aside>

  <div class="main">
    <header class="top">
      <button class="btn btn-sm btn-primary fw-bold" data-bs-toggle="modal" data-bs-target="#mNuevo"><i class="fas fa-plus me-1"></i>Nuevo contrato</button>
      <div class="dropdown">
        <button class="btn btn-light dropdown-toggle" data-bs-toggle="dropdown" id="topuser">...</button>
        <ul class="dropdown-menu dropdown-menu-end"><li><a class="dropdown-item text-danger" href="#" onclick="logout()">Cerrar sesión</a></li></ul>
      </div>
    </header>

    <!-- TABLERO -->
    <section id="v-dash" class="view on">
      <h4 class="fw-bold mb-3">Tablero</h4>
      <div class="row g-3" id="grid"></div>
    </section>

    <!-- CONTRATOS -->
    <section id="v-contratos" class="view">
      <div class="d-flex flex-wrap gap-2 justify-content-between align-items-center mb-3">
        <h4 class="fw-bold mb-0">Contratos <span id="cnt" class="badge bg-secondary fs-6"></span></h4>
        <input id="q" class="form-control" style="max-width:320px" placeholder="Buscar cliente, CUPS, DNI, ref..." oninput="render()">
      </div>
      <div class="card border-0 shadow-sm"><div class="table-responsive">
        <table class="table align-middle mb-0">
          <thead class="table-light"><tr><th></th><th>Ref.</th><th>Cliente</th><th>CUPS</th><th>Estado</th><th>Comercial</th><th>Creado</th><th>Activación</th></tr></thead>
          <tbody id="tbody"></tbody>
        </table>
      </div></div>
    </section>

    <!-- EQUIPO -->
    <section id="v-equipo" class="view">
      <h4 class="fw-bold mb-3">Equipo</h4>
      <div class="card border-0 shadow-sm"><div class="table-responsive">
        <table class="table align-middle mb-0">
          <thead class="table-light"><tr><th>Nombre</th><th>DNI</th><th>Usuario</th><th>Rol</th><th>Jefe</th><th>Estado</th></tr></thead>
          <tbody id="tequipo"></tbody>
        </table>
      </div></div>
    </section>
  </div>
</div>

<!-- MODAL NUEVO CONTRATO -->
<div class="modal fade" id="mNuevo" tabindex="-1"><div class="modal-dialog modal-lg"><div class="modal-content">
  <form onsubmit="nuevoContrato(event)">
    <div class="modal-header"><h5 class="modal-title fw-bold">Registrar contrato</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
    <div class="modal-body"><div class="row g-3">
      <div class="col-md-6"><label class="form-label">Cliente</label><input id="n-cliente" class="form-control" required></div>
      <div class="col-md-3"><label class="form-label">DNI/NIF</label><input id="n-dni" class="form-control" required></div>
      <div class="col-md-3"><label class="form-label">Teléfono</label><input id="n-tel" class="form-control" required></div>
      <div class="col-md-8"><label class="form-label">Dirección</label><input id="n-dir" class="form-control" required></div>
      <div class="col-md-4"><label class="form-label">Tarifa</label>
        <select id="n-tarifa" class="form-select"><option>2.0TD</option><option>3.0TD</option><option>RL.1</option><option>RL.2</option></select></div>
      <div class="col-md-6"><label class="form-label">CUPS</label><input id="n-cups" class="form-control" required></div>
      <div class="col-md-6"><label class="form-label">Tipo</label>
        <select id="n-tipo" class="form-select"><option>CAMBIO DE COMERCIALIZADORA</option><option>CAMBIO DE COMERCIALIZADORA Y TITULAR</option></select></div>
    </div></div>
    <div class="modal-footer"><button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancelar</button><button class="btn btn-primary">Guardar</button></div>
  </form>
</div></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/js/bootstrap.bundle.min.js"></script>
<script>
const SUPABASE_URL = 'https://ughatbtpnkrrgcfalahz.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_DXgx_6-neFL-BpTQLBdFew_XIAizYsQ';
const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const ESTADOS = [
  ['PENDIENTE DE SUBIR DOCUMENTACION','P. subir documentación','#0284c7'],
  ['PENDIENTE DE AUTORIZACION','P. autorización','#d97706'],
  ['PENDIENTE DE FIRMA','P. firma','#7c3aed'],
  ['PENDIENTE VERIFICACION','P. verificación','#475569'],
  ['VERIFICADO','Verificado','#16a34a'],
  ['TRAMITADO','Tramitado','#059669'],
  ['ACTIVO','Activo','#15803d'],
  ['INCIDENCIA','Incidencia','#dc2626'],
  ['INCIDENCIA ALTERNATIVA','Incidencia alt.','#ea580c'],
  ['KO VALOR CREDITICIO','KO crediticio','#991b1b'],
  ['CON COMENTARIOS','Con comentarios','#4f46e5']
];
let perfil = null, contratos = [], filtro = '';
const esDir = () => perfil?.rol === 'director';
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = d => d ? new Date(d).toLocaleString('es-CO',{dateStyle:'medium',timeStyle:'short'}) : '—';
const fmtD = d => d ? new Date(d + 'T00:00:00').toLocaleDateString('es-CO',{dateStyle:'medium'}) : '—';

/* ---------- AUTH ---------- */
window.addEventListener('DOMContentLoaded', async () => {
  const { data: { session } } = await db.auth.getSession();
  if (session) boot(session.user);
});
async function login(e) {
  e.preventDefault();
  const b = document.getElementById('btn-login'), er = document.getElementById('login-err');
  er.style.display = 'none'; b.textContent = 'Verificando...';
  const { data, error } = await db.auth.signInWithPassword({ email: email.value, password: pass.value });
  b.textContent = 'Entrar';
  if (error) { er.textContent = 'Correo o contraseña incorrectos.'; er.style.display = 'block'; return; }
  boot(data.user);
}
async function logout() { await db.auth.signOut(); location.reload(); }

async function boot(user) {
  const { data: p } = await db.from('profiles').select('*').eq('id', user.id).single();
  if (!p || !p.activo) { await db.auth.signOut(); alert('Tu usuario no tiene acceso al CRM.'); return; }
  perfil = p;
  document.getElementById('login').style.display = 'none';
  who.textContent = `${p.nombre || user.email} (${p.rol})`;
  topuser.textContent = p.nombre || user.email;
  if (p.rol !== 'comercial') document.getElementById('nav-equipo').classList.remove('d-none');
  await cargar();
}

/* ---------- NAVEGACIÓN ---------- */
function vista(id, a) {
  document.querySelectorAll('.view').forEach(v => v.classList.remove('on'));
  document.querySelectorAll('.nav-l').forEach(n => n.classList.remove('on'));
  document.getElementById(id).classList.add('on'); if (a) a.classList.add('on');
}

/* ---------- CONTRATOS ---------- */
async function cargar() {
  // RLS ya filtra: comercial = lo suyo, supervisor = su equipo, director = todo
  const { data, error } = await db.from('contratos')
    .select('*, owner:profiles!owner_id(nombre,email)').order('created_at', { ascending: false });
  if (error) return alert('Error: ' + error.message);
  contratos = data; dash(); render();
}
function dash() {
  grid.innerHTML = ESTADOS.map(([k, l, c]) => `
    <div class="col-6 col-md-4 col-xl-3"><div class="sc ${filtro === k ? 'sel' : ''}" onclick="filtrar('${k}')">
      <i style="background:${c}22;color:${c}" class="fas fa-folder-open"></i>
      <div><div class="n">${contratos.filter(x => x.estado === k).length}</div><div class="l">${l}</div></div>
    </div></div>`).join('');
}
function filtrar(k) {
  filtro = filtro === k ? '' : k; dash(); render();
  vista('v-contratos', document.querySelectorAll('.nav-l')[1]);
}
function render() {
  const t = q.value.toLowerCase();
  const lista = contratos.filter(c => (!filtro || c.estado === filtro) &&
    [c.cliente, c.cups, c.dni, c.referencia].some(v => (v || '').toLowerCase().includes(t)));
  cnt.textContent = lista.length;
  tbody.innerHTML = lista.map(c => `
    <tr>
      <td><button class="xb" id="xb-${c.id}" onclick="detalle(${c.id})"><i class="fas fa-plus"></i></button></td>
      <td class="fw-bold">${esc(c.referencia)}</td><td>${esc(c.cliente)}</td><td><code>${esc(c.cups)}</code></td>
      <td><span class="badge bg-light text-dark border">${esc(c.estado)}</span></td>
      <td>${esc(c.owner?.nombre || c.owner?.email)}</td>
      <td class="small">${fmt(c.created_at)}</td><td class="small">${fmtD(c.fecha_activacion)}</td>
    </tr>
    <tr id="d-${c.id}" style="display:none;background:#f8fafc"><td colspan="8"></td></tr>`).join('');
}

/* ---------- DETALLE DESPLEGABLE + DOCUMENTOS ---------- */
async function detalle(id) {
  const row = document.getElementById('d-' + id), btn = document.getElementById('xb-' + id);
  if (row.style.display !== 'none') { row.style.display = 'none'; btn.innerHTML = '<i class="fas fa-plus"></i>'; return; }
  const c = contratos.find(x => x.id === id);
  row.style.display = 'table-row'; btn.innerHTML = '<i class="fas fa-minus"></i>';
  const ctrl = esDir() ? `
    <div class="col-md-4"><span class="lb">Estado de venta</span>
      <select id="est-${id}" class="form-select form-select-sm">${ESTADOS.map(([k]) => `<option ${k === c.estado ? 'selected' : ''}>${k}</option>`).join('')}</select></div>
    <div class="col-md-3"><span class="lb">Fecha de activación</span>
      <input id="fa-${id}" type="date" class="form-control form-control-sm" value="${c.fecha_activacion || ''}"></div>
    <div class="col-md-2 d-flex align-items-end"><button class="btn btn-sm btn-primary w-100" onclick="guardarDir(${id})">Guardar</button></div>`
    : `<div class="col-md-4"><span class="lb">Estado</span>${esc(c.estado)}</div>
       <div class="col-md-3"><span class="lb">Fecha de activación</span>${fmtD(c.fecha_activacion)}</div>`;
  row.firstElementChild.innerHTML = `<div class="det">
    <div class="row g-3 mb-3">
      <div class="col-md-3"><span class="lb">DNI</span>${esc(c.dni)}</div>
      <div class="col-md-3"><span class="lb">Teléfono</span>${esc(c.telefono)}</div>
      <div class="col-md-3"><span class="lb">Dirección</span>${esc(c.direccion)}</div>
      <div class="col-md-3"><span class="lb">Tarifa / Tipo</span>${esc(c.tarifa)} · ${esc(c.tipo)}</div>
      <div class="col-md-3"><span class="lb">Creado</span>${fmt(c.created_at)}</div>
      ${ctrl}
    </div>
    <hr class="my-2">
    <div class="d-flex justify-content-between align-items-center mb-2">
      <strong><i class="fas fa-paperclip me-1"></i>Documentos del cliente</strong>
      <label class="btn btn-sm btn-outline-primary mb-0"><i class="fas fa-upload me-1"></i>Subir archivo
        <input type="file" multiple hidden onchange="subir(${id},this)"></label>
    </div>
    <div id="docs-${id}" class="small text-muted">Cargando...</div></div>`;
  listarDocs(id);
}
async function listarDocs(id) {
  const { data, error } = await db.from('documentos').select('*').eq('contrato_id', id).order('created_at', { ascending: false });
  const el = document.getElementById('docs-' + id); if (!el) return;
  if (error) { el.textContent = error.message; return; }
  el.innerHTML = data.length ? data.map(d => `
    <div class="d-flex justify-content-between border-bottom py-1">
      <a href="#" onclick="verDoc('${esc(d.path)}');return false"><i class="fas fa-file me-1"></i>${esc(d.nombre)}</a>
      <span>${fmt(d.created_at)}</span></div>`).join('') : 'Sin documentos todavía.';
}
async function subir(id, input) {
  for (const f of input.files) {
    const path = `${id}/${Date.now()}_${f.name.replace(/[^\w.\-]/g, '_')}`;
    const up = await db.storage.from('documentos').upload(path, f);
    if (up.error) { alert('Error subiendo ' + f.name + ': ' + up.error.message); continue; }
    const ins = await db.from('documentos').insert({ contrato_id: id, nombre: f.name, path });
    if (ins.error) alert(ins.error.message);
  }
  input.value = ''; listarDocs(id);
}
async function verDoc(path) {
  const { data, error } = await db.storage.from('documentos').createSignedUrl(path, 300);
  if (error) return alert(error.message);
  window.open(data.signedUrl, '_blank');
}

/* ---------- SOLO DIRECTOR: estado + fecha de activación ---------- */
async function guardarDir(id) {
  const fa = document.getElementById('fa-' + id).value || null;
  const { error } = await db.from('contratos')
    .update({ estado: document.getElementById('est-' + id).value, fecha_activacion: fa }).eq('id', id);
  if (error) return alert('No permitido: ' + error.message);
  await cargar(); detalle(id);
}

/* ---------- NUEVO CONTRATO ---------- */
async function nuevoContrato(e) {
  e.preventDefault();
  const { error } = await db.from('contratos').insert({
    referencia: 'REF-' + Date.now().toString().slice(-6),
    cliente: document.getElementById('n-cliente').value, dni: document.getElementById('n-dni').value,
    telefono: document.getElementById('n-tel').value, direccion: document.getElementById('n-dir').value,
    cups: document.getElementById('n-cups').value, tarifa: document.getElementById('n-tarifa').value,
    tipo: document.getElementById('n-tipo').value, owner_id: perfil.id
  });
  if (error) return alert('No se pudo guardar: ' + error.message);
  e.target.reset(); bootstrap.Modal.getInstance(document.getElementById('mNuevo')).hide(); cargar();
}

/* ---------- EQUIPO ---------- */
async function cargarEquipo() {
  const { data, error } = await db.from('profiles')
    .select('nombre,dni,email,rol,activo,manager:profiles!manager_id(nombre,email)').order('rol');
  tequipo.innerHTML = error ? `<tr><td colspan="6" class="text-danger">${esc(error.message)}</td></tr>` :
    data.map(u => `<tr><td><strong>${esc(u.nombre || '—')}</strong></td><td>${esc(u.dni || '—')}</td><td>${esc(u.email)}</td>
      <td><span class="badge bg-secondary text-uppercase">${u.rol}</span></td>
      <td>${esc(u.manager ? (u.manager.nombre || u.manager.email) : '—')}</td>
      <td>${u.activo ? '<span class="badge bg-success">Activo</span>' : '<span class="badge bg-danger">Inactivo</span>'}</td></tr>`).join('');
}
</script>
</body>
</html>
